services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: market_brief
      POSTGRES_USER: market_brief
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_brief -d market_brief"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
