[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equities-daily-brief"
version = "0.1.0"
description = "Auditable end-of-day equities pipeline and AI desk brief"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "pydantic-settings>=2.6",
  "anthropic>=0.40",
  "google-genai>=1.0",
  "openai>=1.0",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
benchmark = ["duckdb>=1.1"]

[project.scripts]
market-brief = "market_brief.cli:main"

[tool.setuptools]
packages = ["market_brief", "engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
